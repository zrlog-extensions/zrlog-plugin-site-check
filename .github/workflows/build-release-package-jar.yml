name: plugin release package
on:
  push:
    branches:
      - master
jobs:
  build:
    name: plugin relase package ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    concurrency:
      group: deploy-on-${{ matrix.os }}-jar
      cancel-in-progress: true
    strategy:
      matrix:
        os: [ubuntu-latest]
        architecture: [ amd64 ]
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'maven'
      - name: Check out ZrLog build scripts
        uses: actions/checkout@v4
        with:
          repository: zrlog/zrlog-build
          ref: e8532208950a2c8902c1dec1b4e259f08af922e5
          path: .zrlog-build
          persist-credentials: false
      - name: Build with Maven
        shell: bash
        env:
          PLUGIN_PACKAGE_PREVIEW: 'false'
        run: bash .zrlog-build/scripts/plugin/build-jar.sh /tmp/download/plugin
      - name: Upload JAR
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SECRET_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SECRET_KEY }}
          ARTIFACT_BUCKET: ${{ secrets.BUCKET }}
          ARTIFACT_ENDPOINT: ${{ secrets.HOST }}
        run: bash .zrlog-build/scripts/plugin/upload-bin.sh /tmp/download plugin
