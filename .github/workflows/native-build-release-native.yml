name: build release native
on:
  push:
    branches:
      - master
jobs:
  build:
    name: plugin relase package ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    concurrency:
      group: deploy-on-${{ matrix.os }}-native
      cancel-in-progress: true

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-22.04,ubuntu-24.04-arm,macos-15-intel,macos-14,windows-2022 ]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          cache: 'maven'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: 'true'

      - name: Check out ZrLog build scripts
        uses: actions/checkout@v4
        with:
          repository: zrlog/zrlog-build
          ref: e8532208950a2c8902c1dec1b4e259f08af922e5
          path: .zrlog-build
          persist-credentials: false
      - name: Build binary
        id: package
        shell: bash
        env:
          PLUGIN_PACKAGE_PREVIEW: 'false'
          PLUGIN_NATIVE_SKIP_TESTS: 'true'
        run: bash .zrlog-build/scripts/plugin/build-native.sh /tmp/download/plugin
      - name: Process Linux binary
        if: runner.os == 'Linux'
        uses: zrlog/zrlog-build@5b539f9a93403c981b9e36554ffb8d3d3e7e8b33 # v1.0.1
        with:
          artifact-file: ${{ steps.package.outputs.artifact_file }}
          artifact-name: ${{ steps.package.outputs.artifact_name }}
          artifact-version: ${{ steps.package.outputs.artifact_version }}
          artifact-architecture: ${{ steps.package.outputs.artifact_architecture }}
          service-url: https://webdav.zrlog.com/artifact
          service-token: ${{ secrets.ARTIFACT_SERVICE_TOKEN }}
      - name: Upload binary
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SECRET_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SECRET_KEY }}
          ARTIFACT_BUCKET: ${{ secrets.BUCKET }}
          ARTIFACT_ENDPOINT: ${{ secrets.HOST }}
        run: bash .zrlog-build/scripts/plugin/upload-bin.sh /tmp/download plugin
